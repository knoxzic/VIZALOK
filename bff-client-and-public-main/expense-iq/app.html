<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense IQ™</title>
  <meta name="description" content="Expense IQ — central ledger financial platform" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-shell" id="app">
    <header class="topbar">
      <div class="topbar__brand">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <span>Expense IQ™</span>
        <span>Live</span>
      </div>
      <div class="topbar__actions">
        <select class="org-switch" id="org-switch" aria-label="Switch organization" title="Organization context (org_id)"></select>
        <span class="badge badge--role" id="role-badge">—</span>
        <button type="button" class="btn btn--sm btn--ghost" id="btn-logout" style="color:#fff;border-color:rgba(255,255,255,.35)">Sign out</button>
      </div>
    </header>

    <div class="backdrop" id="backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="nav-section-label">Workspace</div>
      <nav id="nav"></nav>
      <div class="nav-section-label">Pipeline</div>
      <p style="font-size:12px;color:var(--muted);padding:0 10px;line-height:1.45">
        Capture → Extract → Categorize → <strong>Validation Gate</strong> → Ledger. Nothing bypasses the spine.
      </p>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase/config.js"></script>
  <script src="../js/supabase/client.js"></script>
  <script src="../js/supabase/auth.js"></script>
  <script src="../js/supabase/access.js"></script>
  <script src="../js/device-lease.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-db.js"></script>
  <script src="js/db.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
