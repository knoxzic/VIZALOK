<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome · Best Face Forward Consultants</title>
  <meta name="description" content="Best Face Forward Consultants — Strategy. Solutions. Impact. Moving You Forward." />
  <link rel="icon" href="assets/icon-welcome.jpeg" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/welcome.css" />
  <link rel="stylesheet" href="css/transitions.css" />
</head>
<body class="welcome-page" data-gigi="off">
  <main class="welcome">
    <!-- YouTube full-bleed backdrop (muted, loop, cover) -->
    <div class="welcome__yt" aria-hidden="true">
      <div class="welcome__yt-inner">
        <iframe
          src="https://www.youtube.com/embed/ML47u90lJOw?autoplay=1&mute=1&loop=1&playlist=ML47u90lJOw&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&disablekb=1&fs=0"
          title="Background"
          allow="autoplay; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
      <div class="welcome__yt-shade"></div>
    </div>
    <div class="welcome__ambience" aria-hidden="true"></div>

    <article class="invitation" aria-label="Best Face Forward entrance">
      <span class="invitation__corner invitation__corner--tl" aria-hidden="true"></span>
      <span class="invitation__corner invitation__corner--tr" aria-hidden="true"></span>
      <span class="invitation__corner invitation__corner--bl" aria-hidden="true"></span>
      <span class="invitation__corner invitation__corner--br" aria-hidden="true"></span>

      <p class="invitation__eyebrow">Enterprise platform</p>

      <div class="invitation__logo-wrap">
        <img
          class="invitation__logo"
          src="assets/icon-welcome.jpeg"
          alt="Best Face Forward emblem"
          width="120"
          height="120"
        />
      </div>

      <h1 class="invitation__title">
        Best Face Forward
        <em>Consultants, LLC</em>
      </h1>
      <p class="invitation__sub">Strategy · Solutions · Impact</p>
      <p class="invitation__tagline">Moving You Forward.</p>

      <div class="invitation__video-frame" id="video-frame">
        <video
          id="welcome-video"
          autoplay
          muted
          loop
          playsinline
          poster="assets/icon-welcome.jpeg"
        >
          <source src="assets/logo-video.mp4" type="video/mp4" />
          <source src="LogoVideo.mov" type="video/quicktime" />
          <source src="assets/logo-video.mov" type="video/quicktime" />
        </video>
        <div class="invitation__video-fallback" aria-hidden="true">Moving You Forward.</div>
      </div>

      <a class="invitation__enter" href="landing.html" id="enter-site">
        <span class="invitation__enter-link">Continue</span>
        <span class="invitation__enter-hint">Multi-division consulting &amp; software</span>
      </a>
    </article>

    <p class="welcome__footer-mark">Best Face Forward Enterprise</p>
  </main>

  <script src="js/transitions.js"></script>
  <script>
    (function () {
      const video = document.getElementById("welcome-video");
      const frame = document.getElementById("video-frame");
      if (!video) return;

      function showFallback() {
        frame.classList.add("is-fallback");
      }

      video.addEventListener("error", showFallback);
      video.addEventListener("loadeddata", function () {
        frame.classList.remove("is-fallback");
      });

      setTimeout(function () {
        if (video.readyState === 0) showFallback();
      }, 3000);

      video.play().catch(function () {});
    })();
  </script>
</body>
</html>
