<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success · Best Face Forward</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/transitions.css" />
  <link rel="stylesheet" href="css/portals.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-nav">
      <div class="container site-nav__inner">
        <a class="site-nav__brand" href="landing.html">
          <img src="assets/icon-welcome.jpeg" alt="" width="48" height="48" />
          <span class="site-nav__brand-text">Best Face Forward<span>Consultants</span></span>
        </a>
        <ul class="site-nav__links">
          <li><a href="landing.html">Home</a></li>
          <li><a href="portals/software.html">Software</a></li>
          <li><a href="pages/auth.html">Sign in</a></li>
        </ul>
      </div>
    </header>

    <div class="container">
      <div class="success-panel" id="success-panel">
        <div class="success-panel__check" aria-hidden="true">✓</div>
        <p class="eyebrow">Confirmation</p>
        <h1 id="success-title">You're all set</h1>
        <p class="script">Thank you.</p>
        <p id="success-body" style="color:var(--charcoal-soft);margin-bottom:1.5rem">
          Payment received. Your entitlement is recorded via Stripe and Supabase — sign in with the same email to access products.
        </p>
        <div style="display:flex;flex-direction:column;gap:0.65rem;margin-top:1.25rem">
          <a class="btn btn--primary btn--block" id="success-cta" href="pages/auth.html">Sign in to continue</a>
          <a class="btn btn--outline btn--block" href="landing.html">Return home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/gigi.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const productId = params.get("product");
      // Stripe may return session_id when success_url is configured on the Payment Link

      const product = productId && BFF.config.products[productId];
      if (product) {
        document.getElementById("success-title").textContent = product.name;
        document.getElementById("success-body").textContent =
          "Thank you for purchasing “" +
          product.name +
          "”. After Stripe confirms payment, our webhook records your entitlement in Supabase. Sign in with the same email — products only show as Purchased when you are signed in and the subscription is active.";

        const cta = document.getElementById("success-cta");
        if (product.portal === "academy") {
          cta.href = "portals/academy.html";
          cta.textContent = "Enter Academy";
        } else if (product.portal === "financial") {
          cta.href = "portals/financial.html";
          cta.textContent = "Financial portal";
        } else if (product.portal === "foundation") {
          cta.href = "portals/foundation.html";
          cta.textContent = "Foundation portal";
        } else if (product.portal === "logistics") {
          cta.href = "portals/logistics.html";
          cta.textContent = "Logistics portal";
        } else if (productId === "expense_iq") {
          cta.href = "expense-iq/index.html";
          cta.textContent = "Open Expense IQ";
        } else {
          cta.href = "pages/auth.html";
          cta.textContent = "Sign in to continue";
        }
      }
    })();
  </script>
</body>
</html>
