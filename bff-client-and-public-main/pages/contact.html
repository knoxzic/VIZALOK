<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · Best Face Forward</title>
  <link rel="icon" href="../assets/logo.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/transitions.css" />
  <style>
    .contact-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 1rem 0 5rem;
    }
    .contact-card {
      background: white;
      border: 1px solid rgba(198, 161, 91, 0.3);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-card);
    }
    #contact-status {
      text-align: center;
      margin-top: 1rem;
      font-size: 1rem;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="site-nav">
      <div class="container site-nav__inner">
        <a class="site-nav__brand" href="../landing.html">
          <img src="../assets/icon-welcome.jpeg" alt="" width="48" height="48" />
          <span class="site-nav__brand-text">Best Face Forward<span>Consultants</span></span>
        </a>
        <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="site-nav__links">
          <li><a href="../landing.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="culture.html">Culture</a></li>
          <li><a href="../landing.html#divisions">Services</a></li>
          <li><a href="../portals/academy.html">Academy</a></li>
          <li><a href="contact.html" class="is-active">Contact</a></li>
        </ul>
        <div class="site-nav__cta">
          <a class="btn btn--sm btn--outline" href="auth.html">Sign in</a>
        </div>
      </div>
    </header>

    <div class="page-hero">
      <div class="container">
        <p class="eyebrow">Contact</p>
        <h1>We're listening</h1>
        <p class="script">Tell us how to help.</p>
      </div>
    </div>

    <div class="container contact-wrap">
      <div class="contact-card">
        <form id="contact-form">
          <div class="field">
            <label for="org-name">Organization / Name</label>
            <input id="org-name" name="orgName" required placeholder="Your organization" />
          </div>
          <div class="field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="contactEmail" type="email" required placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="contact-phone">Phone (optional)</label>
            <input id="contact-phone" name="phone" type="tel" placeholder="(optional)" />
          </div>
          <div class="field">
            <label for="division">Division of interest</label>
            <select id="division" name="division">
              <option value="">Select…</option>
              <option value="foundation">Foundation (Grants)</option>
              <option value="financial">Financial Solutions</option>
              <option value="insurance">Insurance Solutions</option>
              <option value="logistics">Logistics Consulting</option>
              <option value="software">G&amp;G Software / Academy</option>
              <option value="expense_iq">Expense IQ</option>
            </select>
          </div>
          <div class="field">
            <label for="business-desc">How can we help?</label>
            <textarea id="business-desc" name="businessDescription" rows="4" placeholder="Brief description"></textarea>
          </div>
          <button type="submit" class="btn btn--primary btn--block" id="contact-submit">Send message</button>
          <p id="contact-status"></p>
        </form>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container">
        <div class="site-footer__bottom" style="border:0;padding-top:0">
          <span>&copy; <span data-year></span> Best Face Forward Consultants, LLC</span>
          <a href="../landing.html">Back to home</a>
        </div>
      </div>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase/config.js"></script>
  <script src="../js/supabase/client.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/transitions.js"></script>
  <script src="../js/gigi.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const product = params.get("product");
      if (product) {
        const desc = document.getElementById("business-desc");
        if (desc && !desc.value) {
          desc.value = "Interested in: " + product.replace(/_/g, " ");
        }
        const div = document.getElementById("division");
        if (div && product === "expense_iq") div.value = "expense_iq";
      }

      document.getElementById("contact-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const status = document.getElementById("contact-status");
        const btn = document.getElementById("contact-submit");
        btn.disabled = true;
        status.textContent = "Sending…";
        status.style.color = "var(--charcoal-muted)";

        const orgName = document.getElementById("org-name").value.trim();
        const email = document.getElementById("contact-email").value.trim();
        const phone = document.getElementById("contact-phone").value.trim();
        const division = document.getElementById("division").value;
        const notes = document.getElementById("business-desc").value.trim();

        const lineMap = {
          foundation: ["analysis"],
          financial: ["bookkeeping", "advisory", "tax"],
          insurance: ["life", "health"],
          logistics: ["analysis"],
          software: ["analysis"],
          expense_iq: ["bookkeeping", "analysis"],
        };

        try {
          const sb = BFF.supabase && BFF.supabase.getClient && BFF.supabase.getClient();
          if (!sb) throw new Error("Connection unavailable");

          const payload = {
            source: "web_form",
            contact_name: orgName,
            email: email.toLowerCase(),
            phone: phone || null,
            lines_of_interest: lineMap[division] || [],
            stage: "new",
            score: 0,
            notes:
              (division ? "Division: " + division + "\n" : "") +
              (product ? "Product: " + product + "\n" : "") +
              (notes || ""),
          };

          const { error } = await sb.from("leads").insert(payload);
          if (error) throw error;

          status.textContent = "Received — thank you. Our team will follow up.";
          status.style.color = "var(--emerald)";
          e.target.reset();
          BFF.ui.toast("Message sent");
        } catch (err) {
          console.error(err);
          status.textContent =
            "Could not send right now. Email us directly or try again. (" +
            (err.message || "error") +
            ")";
          status.style.color = "var(--rose, #a33)";
          // If public_leads policy not applied yet
          if (/policy|RLS|permission|row-level/i.test(err.message || "")) {
            status.textContent +=
              " Run supabase/public_leads.sql in Supabase if this is the first submission.";
          }
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
